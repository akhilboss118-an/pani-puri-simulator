; Export presets for Pani Puri Simulator.
; Format per editor/export/editor_export.cpp: sections are "preset.N" and
; "preset.N.options" (ConfigFile returns the full section name).
; Web target is the no-threads release so it runs on the widest set of browsers.

[preset.0]
name="Web - PaniPuri"
platform="Web"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="build/*,road_demos/*,tools/*,addons/*,*.md,*.out,*.suo"
export_path="build/web/index.html"
runnable=true

[preset.0.options]
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/icon=true
variant/thread_support=false
variant/vram_texture_compression/for_desktop=true
variant/vram_texture_compression/for_mobile=false
vram_texture_compression/for_dedicated_server=false

[preset.1]
name="Windows - PaniPuri"
platform="Windows Desktop"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="build/*,road_demos/*,tools/*,addons/*,*.md"
export_path="build/windows/PaniPuriSimulator.exe"
runnable=true

[preset.1.options]
variant/thread_support=false
variant/vram_texture_compression/for_desktop=true
variant/vram_texture_compression/for_mobile=false

[preset.2]
name="Android - PaniPuri"
platform="Android"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="build/*,road_demos/*,tools/*,addons/*,*.md"
export_path="build/android/PaniPuriSimulator.apk"
runnable=false

[preset.2.options]
gradle_build/use_gradle_build=false
gradle_build/copy_readable_libgdnative_debug=true
gradle_build/copy_readable_libgdnative_release=true
gradle_build/gradle_min_sdk=23
gradle_build/gradle_target_sdk=31
gradle_build/android_additional_config=""
package/signed=true
package/unique_name="com.panipurisimulator.game"
version/code=5
version/name="1.2.1"
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
architectures/aarch64=true
architectures/arm=false
architectures/x86_64=false
architectures/x86=false
debug_script_location="$bin/pani_puri_debug.apks"
release_script_location="$bin/pani_puri_release.apks"
additional_apks=""
